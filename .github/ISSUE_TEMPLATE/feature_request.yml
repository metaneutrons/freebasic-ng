name: Feature request
description: Propose a focused language, platform or tooling improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and platform impact
      description: State affected host and target platforms, if known.
