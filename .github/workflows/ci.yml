name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            family: unix
            expected_host: linux-x86_64
            native_unit_suite: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            family: unix
            expected_host: linux-aarch64
            native_unit_suite: true
          - name: darwin-x86_64
            runner: macos-15-intel
            family: unix
            expected_host: darwin-x86_64
            native_unit_suite: true
          - name: darwin-aarch64
            runner: macos-15
            family: unix
            expected_host: darwin-aarch64
            native_unit_suite: false
          - name: win64
            runner: windows-2025
            family: windows
            expected_host: win64
            native_unit_suite: true
            msystem: MINGW64
            packages: >-
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-gcc
              make
              python
          - name: win32-aarch64
            runner: windows-11-arm
            family: windows
            expected_host: win32-aarch64
            native_unit_suite: true
            msystem: CLANGARM64
            packages: >-
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-gcc
              make
              python

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata (Unix)
        if: matrix.family == 'unix'
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target "${{ matrix.expected_host }}"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libncurses-dev libx11-dev libgpm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Setup MSYS2 (Windows)
        if: matrix.family == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Verify version and bootstrap metadata (Windows)
        if: matrix.family == 'windows'
        shell: msys2 {0}
        run: |
          python scripts/check-version.py
          python scripts/check-bootstrap-provenance.py --target "${{ matrix.expected_host }}"

      - name: Configure and build (Unix)
        if: matrix.family == 'unix'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Configure and build (Windows)
        if: matrix.family == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Test staged installation (Unix)
        if: matrix.family == 'unix'
        run: |
          cmake --install build --prefix stage
          python3 scripts/verify-installed-fbc.py --prefix stage --expected-host "${{ matrix.expected_host }}"

      - name: Test staged installation (Windows)
        if: matrix.family == 'windows'
        shell: msys2 {0}
        run: |
          cmake --install build --prefix stage
          python scripts/verify-installed-fbc.py --prefix stage --expected-host "${{ matrix.expected_host }}"

      # The former Travis matrix is Linux-specific.  M7 additionally requires
      # the complete historical unit suite through a native self-host on every
      # supported host; Darwin ARM and Linux x64 have dedicated jobs below.
      - name: Self-host and run native unit suite (Unix)
        if: matrix.native_unit_suite && matrix.family == 'unix'
        run: |
          PATH="$PWD/stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DFB_BUILD_LEGACY_UNIT_TESTS=ON -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          test "$(selfhost-build/src/compiler/fbc -print host)" = "${{ matrix.expected_host }}"
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

      - name: Self-host and run native unit suite (Windows)
        if: matrix.native_unit_suite && matrix.family == 'windows'
        shell: msys2 {0}
        run: |
          PATH="$PWD/stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DFB_BUILD_LEGACY_UNIT_TESTS=ON -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          test "$(selfhost-build/src/compiler/fbc.exe -print host)" = "${{ matrix.expected_host }}"
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

  darwin-aarch64-selfhost:
    name: Self-host Darwin ARM64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target darwin-aarch64

      - name: Install build dependencies
        run: brew install cmake ninja

      - name: Build and stage seed compiler
        run: |
          cmake -S . -B seed-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFB_BUILD_GFXLIB=OFF -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build seed-build
          cmake --install seed-build --prefix seed-stage

      - name: Self-host compiler and run CTest
        run: |
          PATH="$PWD/seed-stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON -DFB_BUILD_TESTS=ON \
            -DFB_BUILD_LEGACY_UNIT_TESTS=ON -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

  linux-x86_64-legacy-tests:
    name: Legacy suites Linux x64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libncurses-dev libx11-dev libgpm-dev libaspell-dev libcurl4-openssl-dev libpcre2-dev

      - name: Build and stage seed compiler
        run: |
          cmake -S . -B seed-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFB_BUILD_GFXLIB=OFF -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build seed-build
          cmake --install seed-build --prefix seed-stage

      - name: Self-host compiler and run legacy CTest suites
        run: |
          PATH="$PWD/seed-stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DFB_BUILD_LEGACY_LOG_TESTS=ON -DFB_BUILD_LEGACY_WARNING_TESTS=ON \
            -DFB_BUILD_LEGACY_SYNTAX_TESTS=ON -DFB_BUILD_LEGACY_DOC_TOOLS=ON \
            -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

  linux-x86_64-legacy-debug:
    name: Legacy debug Linux x64 (${{ matrix.backend }}, ${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: release
            backend: gcc
            compiler_debug: OFF
            test_debug: OFF
          - id: test-debug
            backend: gcc
            compiler_debug: OFF
            test_debug: ON
          - id: compiler-debug
            backend: gcc
            compiler_debug: ON
            test_debug: OFF
          - id: full-debug
            backend: gcc
            compiler_debug: ON
            test_debug: ON
          - id: release
            backend: gas64
            compiler_debug: OFF
            test_debug: OFF
          - id: test-debug
            backend: gas64
            compiler_debug: OFF
            test_debug: ON
          - id: compiler-debug
            backend: gas64
            compiler_debug: ON
            test_debug: OFF
          - id: full-debug
            backend: gas64
            compiler_debug: ON
            test_debug: ON

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libncurses-dev libx11-dev libxext-dev libxpm-dev libxrandr-dev libxrender-dev libffi-dev libgpm-dev libaspell-dev libcurl4-openssl-dev libpcre2-dev

      - name: Build and stage seed compiler
        run: |
          cmake -S . -B seed-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFB_COMPILER_DEBUG=${{ matrix.compiler_debug }} \
            -DFB_BUILD_GFXLIB=OFF -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build seed-build
          cmake --install seed-build --prefix seed-stage

      - name: Self-host compiler and run historical suites
        run: |
          PATH="$PWD/seed-stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DFB_NATIVE_COMPILER_BACKEND=${{ matrix.backend }} \
            -DFB_COMPILER_DEBUG=${{ matrix.compiler_debug }} \
            -DFB_LEGACY_TEST_DEBUG=${{ matrix.test_debug }} \
            -DFB_BUILD_LEGACY_UNIT_TESTS=ON -DFB_BUILD_LEGACY_LOG_TESTS=ON \
            -DFB_BUILD_LEGACY_WARNING_TESTS=ON -DFB_BUILD_LEGACY_SYNTAX_TESTS=ON \
            -DFB_BUILD_LEGACY_DOC_TOOLS=ON -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=OFF -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

  linux-x86-legacy-debug:
    name: Legacy debug Linux x86 (${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: release
            compiler_debug: OFF
            test_debug: OFF
          - id: test-debug
            compiler_debug: OFF
            test_debug: ON
          - id: compiler-debug
            compiler_debug: ON
            test_debug: OFF
          - id: full-debug
            compiler_debug: ON
            test_debug: ON

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gcc-multilib g++-multilib \
            libc6-dev-i386 libcunit1-dev:i386 \
            libncurses-dev libncurses-dev:i386 libx11-dev:i386 libxext-dev:i386 \
            libxpm-dev:i386 libxrandr-dev:i386 libxrender-dev:i386 libffi-dev:i386 \
            libgpm-dev:i386 libaspell-dev:i386 libcurl4-openssl-dev:i386 \
            libpcre2-dev:i386

      - name: Build verified historical x86 seed compiler
        run: |
          archive="$RUNNER_TEMP/FreeBASIC-1.05.0-source-bootstrap.tar.xz"
          bootstrap_dir="$RUNNER_TEMP/FreeBASIC-1.05.0-source-bootstrap"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$archive" \
            https://github.com/freebasic/fbc/releases/download/1.05.0/FreeBASIC-1.05.0-source-bootstrap.tar.xz
          echo "cbf5c28c8cc0d34dd71c50c8f8e574aab7f7a341c39cb952f6434cfecb06d82f  $archive" \
            | sha256sum --check --status
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' \
            'CC = gcc -m32' \
            'AS = as --32' \
            'TARGET_ARCH = x86' \
            'CFLAGS += -DDISABLE_X11 -DDISABLE_GPM -DDISABLE_FFI -DDISABLE_OPENGL' \
            > "$bootstrap_dir/config.mk"
          # The 1.05 bootstrap target omits rtlib from bootstrap/fbc's
          # prerequisites.  Build the runtime first so parallel make cannot
          # link fbc against a half-written libfb.a.
          make -C "$bootstrap_dir" -j"$(nproc)" rtlib gfxlib2
          make -C "$bootstrap_dir" -j"$(nproc)" bootstrap
          file "$bootstrap_dir/bin/fbc" | grep -q 'ELF 32-bit'
          echo "FBC_SEED_DIR=$bootstrap_dir" >> "$GITHUB_ENV"

      - name: Self-host x86 compiler and run historical suites
        run: |
          # Travis first built a current fbc1 with the 1.05 seed, then used
          # fbc1—not the historical seed—to rebuild the final compiler.  The
          # two stages are both CMake builds here; fbc1 preserves the current
          # compiler's direct-link semantics for the final x86 GAS objects.
          PATH="$FBC_SEED_DIR/bin:$PATH" cmake -S . -B seed-selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/linux-x86.cmake" \
            -DFB_NATIVE_COMPILER_OBJECTS=ON -DFB_NATIVE_COMPILER_BACKEND=gas \
            -DFB_NATIVE_COMPILER_LINK_WITH_SEED_RUNTIME=ON \
            -DFB_COMPILER_DEBUG=${{ matrix.compiler_debug }} \
            -DFB_BUILD_GFXLIB=OFF \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build seed-selfhost-build
          cmake --install seed-selfhost-build --prefix "$PWD/seed-selfhost-stage"
          test "$(seed-selfhost-stage/bin/fbc -print host)" = "linux-x86"
          file seed-selfhost-stage/bin/fbc | grep -q 'ELF 32-bit'

          PATH="$PWD/seed-selfhost-stage/bin:$PATH" cmake -S . -B selfhost-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFB_USE_SYSTEM_FBC=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/linux-x86.cmake" \
            -DFB_NATIVE_COMPILER_OBJECTS=ON -DFB_NATIVE_COMPILER_BACKEND=gas \
            -DFB_COMPILER_DEBUG=${{ matrix.compiler_debug }} \
            -DFB_LEGACY_TEST_DEBUG=${{ matrix.test_debug }} \
            -DFB_BUILD_LEGACY_UNIT_TESTS=ON -DFB_BUILD_LEGACY_LOG_TESTS=ON \
            -DFB_BUILD_LEGACY_WARNING_TESTS=ON -DFB_BUILD_LEGACY_SYNTAX_TESTS=ON \
            -DFB_BUILD_LEGACY_DOC_TOOLS=ON -DFB_BUILD_GFXLIB=ON \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=OFF -DFB_DISABLE_OPENGL=ON
          cmake --build selfhost-build
          test "$(selfhost-build/src/compiler/fbc -print host)" = "linux-x86"
          test "$(selfhost-build/src/compiler/fbc -print target)" = "linux-x86"
          file selfhost-build/src/compiler/fbc | grep -q 'ELF 32-bit'
          ctest --test-dir selfhost-build --output-on-failure
          git diff --exit-code

  amigaos-m68k:
    name: AmigaOS 3 m68k runtime smoke
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Load pinned AmigaOS/m68k toolchain inputs
        run: python3 scripts/verify-amiga-m68k-toolchain.py --github-env "$GITHUB_ENV"

      - name: Provision pinned AmigaOS toolchain
        run: |
          docker pull "$AMIGA_GCC_IMAGE"
          container_id="$(docker create "$AMIGA_GCC_IMAGE")"
          mkdir -p "$RUNNER_TEMP/amiga"
          docker cp "$container_id":/opt/amiga/. "$RUNNER_TEMP/amiga"
          docker rm "$container_id"
          "$RUNNER_TEMP/amiga/bin/m68k-amigaos-gcc" --version | head -1
          test -f "$RUNNER_TEMP/amiga/m68k-amigaos/lib/libamiga.a"
          echo "$RUNNER_TEMP/amiga/bin" >> "$GITHUB_PATH"

      - name: Provision pinned Vamos runner
        run: |
          python3 -m venv "$RUNNER_TEMP/vamos"
          "$RUNNER_TEMP/vamos/bin/pip" install --disable-pip-version-check --no-cache-dir \
            "amitools[vamos]==$AMITOOLS_VERSION" "machine68k==$MACHINE68K_VERSION"
          "$RUNNER_TEMP/vamos/bin/vamos" --help >/dev/null

      - name: Build native compiler
        run: |
          cmake -S . -B host-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFB_BUILD_GFXLIB=OFF -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build host-build --target fbc

      - name: Build AmigaOS runtime
        run: |
          cmake -S . -B amiga-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/amiga-m68k.cmake \
            -DAMIGA_GCC_ROOT="$RUNNER_TEMP/amiga" \
            -DFB_BUILD_COMPILER=OFF -DFB_BUILD_GFXLIB=OFF \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON -DFB_DISABLE_FFI=ON \
            -DFB_DISABLE_OPENGL=ON
          cmake --build amiga-build --target fb

      - name: Generate and link AmigaOS smoke program
        run: |
          FBC="$PWD/host-build/src/compiler/fbc" \
          FB_AMIGA_RUNTIME="$PWD/amiga-build/src/rtlib/libfb.a" \
          AMIGA_GCC_SYSROOT="$RUNNER_TEMP/amiga/m68k-amigaos" \
          AMIGA_TEST_RUNNER=/bin/true \
          FB_AMIGA_BUILD_DIR="$RUNNER_TEMP/amiga-smoke" \
          test/amiga/build_and_test.sh test/amiga/smoke.bas

      - name: Run AmigaOS smoke program under Vamos
        run: |
          set -o pipefail
          test -f "$RUNNER_TEMP/amiga-smoke/smoke"
          file "$RUNNER_TEMP/amiga-smoke/smoke"
          # The pinned amiga-gcc libamiga exit path reaches Vamos' unimplemented
          # process-termination handling after the program has printed its marker.
          # Keep this narrowly scoped: a missing marker or any other exit status fails.
          set +e
          "$RUNNER_TEMP/vamos/bin/vamos" -C 68020 "$RUNNER_TEMP/amiga-smoke/smoke" \
            | tee "$RUNNER_TEMP/amiga-smoke-output.txt"
          vamos_status="${PIPESTATUS[0]}"
          set -e
          grep -Fx 'FreeBASIC-NG AmigaOS M3 smoke' "$RUNNER_TEMP/amiga-smoke-output.txt"
          if [[ "$vamos_status" -ne 0 && "$vamos_status" -ne 255 ]]; then
            exit "$vamos_status"
          fi
          if [[ "$vamos_status" -eq 255 ]]; then
            echo "Vamos completed the smoke output but cannot validate libamiga process termination."
          fi

  morphos-ppc:
    name: MorphOS PowerPC runtime link
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Load pinned MorphOS SDK inputs
        run: python3 scripts/verify-morphos-ppc-toolchain.py --github-env "$GITHUB_ENV"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libncurses-dev libx11-dev libgpm-dev

      - name: Provision pinned MorphOS SDK
        run: |
          docker pull "$MORPHOS_GCC_IMAGE"
          container_id="$(docker create "$MORPHOS_GCC_IMAGE")"
          sudo mkdir -p /opt/ppc-morphos
          sudo docker cp "$container_id":/opt/ppc-morphos/. /opt/ppc-morphos
          docker rm "$container_id"
          python3 scripts/verify-morphos-ppc-toolchain.py --verify-installed

      - name: Build native C producer
        run: |
          cmake -S . -B host-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFB_BUILD_GFXLIB=OFF -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON \
            -DFB_DISABLE_FFI=ON -DFB_DISABLE_OPENGL=ON
          cmake --build host-build --target fbc

      - name: Build MorphOS runtime
        run: |
          cmake -S . -B morphos-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/morphos-ppc.cmake \
            -DMORPHOS_GCC_ROOT=/opt/ppc-morphos \
            -DFB_BUILD_COMPILER=OFF -DFB_BUILD_GFXLIB=OFF \
            -DFB_DISABLE_X11=ON -DFB_DISABLE_GPM=ON -DFB_DISABLE_FFI=ON \
            -DFB_DISABLE_OPENGL=ON
          cmake --build morphos-build --target fb

      - name: Generate and link MorphOS smoke program
        run: |
          FBC="$PWD/host-build/src/compiler/fbc" \
          FB_MORPHOS_RUNTIME="$PWD/morphos-build/src/rtlib/libfb.a" \
          FB_MORPHOS_BUILD_DIR="$RUNNER_TEMP/morphos-smoke" \
          MORPHOS_CC=/opt/ppc-morphos/bin/ppc-morphos-gcc \
          MORPHOS_OBJDUMP=/opt/ppc-morphos/bin/ppc-morphos-objdump \
          MORPHOS_READELF=/opt/ppc-morphos/bin/ppc-morphos-readelf \
          test/morphos/build_and_link.sh test/morphos/smoke.bas

  target-generation:
    name: Target generation (C output only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version and bootstrap metadata
        run: |
          python3 scripts/check-version.py
          python3 scripts/check-bootstrap-provenance.py --target linux-x86_64

      - name: Build native producer
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libncurses-dev libx11-dev libgpm-dev
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Generate C for declared targets
        run: |
          printf 'Print "FreeBASIC-NG target smoke"\n' > /tmp/hello.bas
          generate() {
            target_name="$1"
            target_os="$2"
            target_arch="$3"
            output="/tmp/${target_name}.c"
            ./build/src/compiler/fbc -gen gcc -r -m hello -target "$target_os" -arch "$target_arch" /tmp/hello.bas
            mv /tmp/hello.c "$output"
            grep -q "fb_PrintString" "$output"
            echo "generated C only for ${target_name}; no target ABI, linker or runtime assertion"
          }
          generate linux-x86_64 linux x86_64
          generate linux-aarch64 linux aarch64
          generate darwin-x86_64 darwin x86_64
          generate darwin-aarch64 darwin aarch64
          generate win64 win32 x86_64
          generate win32-aarch64 win32 aarch64
          for target in amiga aros-x86_64 aros-aarch64 morphos amigaos4; do
            ./build/src/compiler/fbc -gen gcc -r -m hello -target "$target" /tmp/hello.bas
            grep -q "fb_PrintString" /tmp/hello.c
            echo "generated C only for ${target}; no target ABI, linker or runtime assertion"
          done
