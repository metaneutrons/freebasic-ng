name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-14
            name: darwin-aarch64
          - os: windows-latest
            name: win64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify version metadata
        run: python3 scripts/check-version.py

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libncurses-dev libx11-dev libgpm-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gcc

      - name: Configure & Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_STANDALONE=ON -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_STANDALONE=ON -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Test fbc
        if: runner.os != 'Windows'
        run: ./build/src/compiler/fbc --version

      - name: Test fbc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build/src/compiler/fbc.exe --version

  amiga-test:
    name: AmigaOS targets (C generation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify version metadata
        run: python3 scripts/check-version.py

      - name: Build fbc
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libncurses-dev libx11-dev libgpm-dev
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFB_STANDALONE=ON -DFB_BUILD_GFXLIB=OFF
          cmake --build build

      - name: Test all Amiga targets
        run: |
          echo 'Print "Hello Amiga!"' > /tmp/hello.bas
          for target in amiga aros-x86_64 aros-aarch64 morphos amigaos4; do
            ./build/src/compiler/fbc -gen gcc -r -m hello -target $target /tmp/hello.bas
            if grep -q "fb_PrintString" /tmp/hello.c; then
              echo "validated generated C for $target"
            else
              echo "missing generated runtime call for $target"
              exit 1
            fi
          done
          echo "All Amiga targets generate valid C!"
