<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">FreeBASIC-NG — a modern multi-platform BASIC compiler</title>
  <desc id="desc">FreeBASIC-NG wordmark on a dark technical field in mint and blue. Release binaries cover Linux x86-64 and ARM64, macOS Intel and Apple silicon, and Windows x86-64 and ARM64. Developer-preview target SDKs cover AmigaOS m68k and MorphOS PowerPC.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b2a"/>
      <stop offset="1" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#76e5c2"/>
      <stop offset=".55" stop-color="#86b9ff"/>
      <stop offset="1" stop-color="#667eea"/>
    </linearGradient>
    <radialGradient id="mint-glow">
      <stop stop-color="#76e5c2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#76e5c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop stop-color="#86b9ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#86b9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#adc5e2" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="460" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="url(#background)"/>
    <rect width="1280" height="460" fill="url(#grid)"/>
    <ellipse cx="176" cy="220" rx="360" ry="330" fill="url(#mint-glow)"/>
    <ellipse cx="1120" cy="80" rx="410" ry="310" fill="url(#blue-glow)"/>
    <g fill="none" stroke="#86b9ff" stroke-opacity=".075">
      <circle cx="1200" cy="470" r="210"/>
      <circle cx="1200" cy="470" r="270"/>
      <circle cx="1200" cy="470" r="330"/>
    </g>
    <rect width="1280" height="4" fill="url(#accent)"/>
    <text x="78" y="67" fill="#a4b3c7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3">MODERN BASIC · MULTI-PLATFORM</text>
    <g transform="translate(78 111)">
      <rect width="184" height="184" rx="42" fill="url(#accent)"/>
      <rect x="2" y="2" width="180" height="180" rx="40" fill="none" stroke="#f4f7fb" stroke-opacity=".28"/>
      <text x="92" y="118" fill="#0b1220" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-7" text-anchor="middle">FB</text>
      <path d="M35 146h114" stroke="#0b1220" stroke-opacity=".38" stroke-width="3"/>
      <g fill="#0b1220" opacity=".62">
        <rect x="35" y="157" width="7" height="7"/>
        <rect x="49" y="157" width="7" height="7"/>
        <rect x="63" y="157" width="7" height="7"/>
      </g>
    </g>
    <text x="310" y="210" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="750" letter-spacing="-5">FreeBASIC-NG</text>
    <text x="316" y="262" fill="#a4b3c7" font-family="Arial, Helvetica, sans-serif" font-size="28">A modern, multi-platform BASIC compiler.</text>
    <text x="318" y="298" fill="#76e5c2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1">fbc  ·  CMake  ·  native Cocoa  ·  verified releases</text>
    <path d="M80 345h1120" stroke="#adc5e2" stroke-opacity=".17"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <g font-size="12" font-weight="700" letter-spacing="2">
        <text x="80" y="378" fill="#76e5c2">LINUX</text>
        <text x="425" y="378" fill="#86b9ff">MACOS</text>
        <text x="830" y="378" fill="#76e5c2">WINDOWS</text>
      </g>
      <g font-size="17">
        <text x="80" y="407" fill="#d7e2f0">x86_64 · ARM64</text>
        <text x="425" y="407" fill="#d7e2f0">Intel · Apple silicon</text>
        <text x="830" y="407" fill="#d7e2f0">x86_64 · ARM64</text>
      </g>
      <text x="80" y="438" fill="#71829a" font-size="12" letter-spacing="1.5">TARGET SDK PREVIEWS</text>
      <text x="257" y="438" fill="#a4b3c7" font-size="13">AmigaOS 3 / m68k · MorphOS / PowerPC</text>
    </g>
  </g>
</svg>
